<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Draft: keeps Google from listing the site. Remove at launch. -->
    <meta name="robots" content="noindex, nofollow">
    <title>Savannah Dodson Art</title>
    <meta name="description" content="Fine prints and originals by Savannah Dodson, an oil painter inspired by the Pacific Northwest.">
    <meta name="theme-color" content="#1c261f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="assets/images/sabg.webp" type="image/webp">
    <link rel="prefetch" href="cart.html">
    <link rel="stylesheet" href="style.css">
    <script>document.documentElement.classList.add("js");</script>
</head>
<body>
    <a class="skip-link" href="#gallery">Skip to the artwork</a>

    <!-- Background photo. It slides up as you scroll, revealing more of it. -->
    <div class="bg" aria-hidden="true">
        <picture>
            <source srcset="assets/images/sabg.webp" type="image/webp">
            <img id="bgImage" src="assets/images/sabg.jpg" alt="" width="1400" height="1867" fetchpriority="high" decoding="async">
        </picture>
    </div>

    <header class="site-header" id="siteHeader">
        <div class="container header-inner">
            <a href="index.html" class="logo">Savannah's Art Works</a>
            <a href="cart.html" class="cart-link">Cart (<span class="cart-count">0</span>)</a>
        </div>
    </header>

    <main id="main">
        <section class="intro">
            <div class="container">
                <h1 class="split-words">Savannah Dodson Art</h1>
                <p class="intro-text reveal" style="--delay: 0.45s">Oil painter inspired by the Pacific Northwest</p>
                <p class="intro-sub reveal" style="--delay: 0.6s">Fine prints and originals</p>
            </div>
        </section>

        <section class="gallery-section" aria-label="Artwork for sale">
            <div class="container">
                <div id="gallery" class="gallery" tabindex="-1"></div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner reveal">
            <p>Questions? Email <a href="mailto:savannahdodsonart@gmail.com">savannahdodsonart@gmail.com</a></p>
            <p><a href="https://www.instagram.com/savannahdodson_art/" target="_blank" rel="noopener">Instagram @savannahdodson_art</a></p>
            <p class="copyright">&copy; <span id="currentYear"></span> Savannah's Art Works</p>
        </div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="assets/js/lenis.min.js" defer></script>
    <script src="artwork.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
